{% extends "students/base.html" %}

{% block title %}Ders Seç{% endblock %}

{% block content %}

    <p>
        Katalogdan dersi ve hangi akademik dönemde alacağını seç.
        Gönderdiğin kayıt koordinatör tarafından incelenecek.

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

    </form>
{% endblock %}
