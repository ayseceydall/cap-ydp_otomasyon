<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ÇAP/YDP Öğrenci Takip Sistemi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 360px;
            max-width: calc(100% - 48px);
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000012;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            color: white;
            background: #2457a7;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .errorlist {
            color: #b42318;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>ÇAP/YDP Takip Sistemi</h1>
        <p>Hesabınıza giriş yapın.</p>

        {% if form.errors %}
            <p style="color: #b42318;">
                Kullanıcı adı veya parola hatalı.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            {{ form.as_p }}

            <button type="submit">Giriş yap</button>
        </form>
    </div>
</body>
</html>
